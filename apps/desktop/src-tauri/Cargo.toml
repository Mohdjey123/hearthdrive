[package]
name = "nexus-desktop"
description = "NEXUS Cloud app shell: desktop window on Windows, embedded node on Android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nexus_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# On phones the app hosts the node itself; there is no separate service.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
nexus-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tauri-plugin-barcode-scanner = "2"
futures-util = { workspace = true }
reqwest = { workspace = true }
