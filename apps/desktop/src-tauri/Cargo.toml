[package]
name = "nexus-desktop"
description = "HearthDrive app shell: desktop window on Windows, embedded node on Android"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nexus_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nexus-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# On computers the window hides to the system tray when closed, and a
# second launch shows the window that is already running.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

# On phones the app hosts the node itself; there is no separate service.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
nexus-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tauri-plugin-barcode-scanner = "2"
futures-util = { workspace = true }
reqwest = { workspace = true }

# Android runs the node in its own process, under a foreground service
# (`NodeService`), which starts it through JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
