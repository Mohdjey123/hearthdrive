[package]
name = "nexus-api"
description = "Versioned HTTP + WebSocket API for a Hearthdrive node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Local time, for transfer hours.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nexus-common = { workspace = true }
nexus-database = { workspace = true }
nexus-devices = { workspace = true }
nexus-indexer = { workspace = true }
nexus-network = { workspace = true }
nexus-security = { workspace = true }
nexus-storage = { workspace = true }
nexus-vdrive = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
# Share links: encrypting files for Send, and talking to the link services.
reqwest = { workspace = true, features = ["rustls-no-provider", "multipart"] }
ring = "0.17"
rustls = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
# Shared folders are sent as one zip file.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Opening archives: .tar, .tar.gz and .7z.
tar = "0.4"
flate2 = "1"
sevenz-rust2 = { version = "0.25", default-features = false, features = ["ppmd", "deflate"] }
futures-util = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
socket2 = "0.6"
netdev = "0.46"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6"
lofty = "0.22"
pdf-extract = "0.9"
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

tempfile = { workspace = true }
dav-server = "0.12.0"
percent-encoding = "2"

[dev-dependencies]
# A passkey in memory, to sign in with in tests.
nexus-security = { workspace = true, features = ["soft-authenticator"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_FaceAnalysis",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
] }
