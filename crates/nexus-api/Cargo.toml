[package]
name = "nexus-api"
description = "Versioned HTTP + WebSocket API for a NEXUS node"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Local time, for transfer hours.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nexus-common = { workspace = true }
nexus-database = { workspace = true }
nexus-devices = { workspace = true }
nexus-indexer = { workspace = true }
nexus-network = { workspace = true }
nexus-security = { workspace = true }
nexus-storage = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
# Share links: encrypting files for Send, and talking to the link services.
reqwest = { workspace = true, features = ["rustls-no-provider", "multipart"] }
ring = "0.17"
rustls = { workspace = true }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1"
# Shared folders are sent as one zip file.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures-util = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }

tempfile = { workspace = true }

[dev-dependencies]
# A passkey in memory, to sign in with in tests.
nexus-security = { workspace = true, features = ["soft-authenticator"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
