[package]
name = "nexus-storage"
description = "Storage roots, safe path resolution and file operations"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nexus-common = { workspace = true }
nexus-database = { workspace = true }
dunce = { workspace = true }
mime_guess = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Asking disks about their health directly, which needs no administrator.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }

[dev-dependencies]
tempfile = { workspace = true }
