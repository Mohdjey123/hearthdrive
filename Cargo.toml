[workspace]
resolver = "3"
members = [
    "crates/nexus-common",
    "crates/nexus-database",
    "crates/nexus-storage",
    "crates/nexus-indexer",
    "crates/nexus-security",
    "crates/nexus-network",
    "crates/nexus-devices",
    "crates/nexus-api",
    "crates/nexus-core",
    "crates/nexus-vdrive",
    "apps/desktop/src-tauri",
]
# `cargo build` / `cargo test` at the root build the service only.
# The Tauri shell is built through `npm run desktop` (or `-p nexus-desktop`).
default-members = [
    "crates/nexus-common",
    "crates/nexus-database",
    "crates/nexus-storage",
    "crates/nexus-indexer",
    "crates/nexus-security",
    "crates/nexus-network",
    "crates/nexus-devices",
    "crates/nexus-api",
    "crates/nexus-core",
    "crates/nexus-vdrive",
]

[workspace.package]
version = "0.1.7"
edition = "2024"
license = "FSL-1.1-ALv2"
rust-version = "1.85"
repository = "https://github.com/nexus-cloud/nexus-cloud"

[workspace.dependencies]
nexus-common = { path = "crates/nexus-common" }
nexus-database = { path = "crates/nexus-database" }
nexus-storage = { path = "crates/nexus-storage" }
nexus-indexer = { path = "crates/nexus-indexer" }
nexus-security = { path = "crates/nexus-security" }
nexus-network = { path = "crates/nexus-network" }
nexus-devices = { path = "crates/nexus-devices" }
nexus-api = { path = "crates/nexus-api" }
nexus-core = { path = "crates/nexus-core" }
nexus-vdrive = { path = "crates/nexus-vdrive" }

anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "macros"] }
base64 = "0.22"
blake3 = "1"
dunce = "1"
ed25519-dalek = "2"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
# Built-in peer-to-peer networking: QUIC dialed by public key, hole punching, relays.
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
mime_guess = "2"
notify = "8"
rand_core = { version = "0.6", features = ["getrandom"] }
# HTTP client for integration tests.
reqwest = { version = "0.13", default-features = false, features = ["stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk", "system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "set-header"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }
walkdir = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Threading"] }

[profile.release]
# Fast enough to release often: every core compiles, and no link-time
# optimisation (the slowest step). Installers come out slightly larger.
lto = false
codegen-units = 16
strip = true
