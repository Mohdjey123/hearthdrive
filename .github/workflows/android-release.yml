# Builds the signed Android app for a release and adds it, with its signed
# update description, to the release on the public releases repository.
# Every NEXUS device looks there for updates (besides its paired devices).
#
# Runs when a tag like v1.2.3 is pushed (scripts/release.sh --github does
# that), or by hand from the Actions tab for an existing tag.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64    the keystore that signs the APK, base64. Use the
#                              key that signed the app already on your phones,
#                              or Android refuses to install updates over it.
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias in it
#   ANDROID_KEY_PASSWORD       the key's password (if different)
#   NEXUS_UPDATE_KEY           the contents of ~/.nexus-signing/update-key
#   RELEASES_TOKEN             a fine-grained token with "Contents: read and
#                              write" on the releases repository only
name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, like v0.1.5'
        required: true

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.event.inputs.tag || github.ref_name }}

env:
  RELEASES_REPO: Mohdjey123/nexus-cloud-releases
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  NDK_VERSION: 27.0.12077973

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Version from the tag
        run: |
          VERSION="${TAG#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The tag must look like v1.2.3, not $TAG" >&2; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # The same places scripts/release.sh sets. Android's versionCode is
          # worked out from it (major * 1000000 + minor * 1000 + patch).
          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$VERSION\"/" Cargo.toml
          sed -i -E "0,/\"version\": \"[^\"]+\"/s//\"version\": \"$VERSION\"/" apps/desktop/package.json apps/desktop/src-tauri/tauri.conf.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Android NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Keys
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NEXUS_UPDATE_KEY_TEXT: ${{ secrets.NEXUS_UPDATE_KEY }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "The ANDROID_KEYSTORE_BASE64 secret is missing" >&2; exit 1; }
          [ -n "$NEXUS_UPDATE_KEY_TEXT" ] || { echo "The NEXUS_UPDATE_KEY secret is missing" >&2; exit 1; }
          umask 077
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf '%s\n' "$NEXUS_UPDATE_KEY_TEXT" > "$RUNNER_TEMP/update-key"

      - name: Build the APK
        env:
          NEXUS_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          NEXUS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEXUS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEXUS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/build-android.sh aarch64 release

      - name: Sign the update
        run: |
          APK="$(ls apps/desktop/src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk | grep -v unsigned | head -1)"
          mkdir -p out
          NAME="NEXUS-Cloud_${VERSION}_arm64.apk"
          cp "$APK" "out/$NAME"
          cargo build --release -p nexus-core --bin nexus-release
          NOTES_ARGS=()
          [ -f "docs/releases/$VERSION.md" ] && NOTES_ARGS=(--notes "docs/releases/$VERSION.md")
          target/release/nexus-release sign --key "$RUNNER_TEMP/update-key" --platform android-aarch64 --version "$VERSION" \
            --package "out/$NAME" --out out/nexus-update-android-aarch64.json "${NOTES_ARGS[@]}"
          (cd out && sha256sum "$NAME" > "$NAME.sha256")
          rm -f "$RUNNER_TEMP/update-key" "$RUNNER_TEMP/release.keystore"

      - name: Add to the release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ env.TAG }}
          name: NEXUS Cloud ${{ env.VERSION }}
          target_commitish: main
          files: |
            out/NEXUS-Cloud_${{ env.VERSION }}_arm64.apk
            out/NEXUS-Cloud_${{ env.VERSION }}_arm64.apk.sha256
            out/nexus-update-android-aarch64.json
